<!DOCTYPE html>
<html lang="en">

<head>
<link rel="stylesheet" href="../../assets/css/common.css">
<link rel="stylesheet" href="../../assets/css/company_registration.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Company registration </title>
</head>

<body>
  <header class="landing-nav">
    <div class="brand">
      <div class="brand_logo">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
          <rect x="9" y="11" width="6" height="5" rx="1"></rect>
          <path d="M10 11V9a2 2 0 1 1 4 0v2"></path>
        </svg>
      </div>
      <span class="brand-logo-text">SecureAuth</span>
    </div>
    <div class="header-buttons">
      <button class="header-button"> Get started for free </button>
      <button class="header-button"> company login </button>
    </div>
  </header>
  <form class="registration-page">
    <div class="form-data">
      <svg xmlns="http://w3.org" viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <path d="M3 21h18"></path>
  <path d="M5 21V7l8-4v18"></path>
  <path d="M19 21V11l-6-3"></path>
  <path d="M9 9v.01"></path>
  <path d="M9 12v.01"></path>
  <path d="M9 15v.01"></path>
  <path d="M9 18v.01"></path>
</svg>

      <h2>Register Organization</h2>
      <input type="text" name="company_name" class="input-box" placeholder="Company/Organization Name">
      <input type="email" name="admin_email" class="input-box" placeholder="Company Admin Email">
      <input type="password" name="password" class="input-box" placeholder="Admin password (Min 8 chars)">
      <input type="password" name="confirm_password" class="input-box" placeholder="Confirm password">
      <button type="submit" class="account-create">Create Account</button>
      <p class="login-link">
        Already have an account?
        <a href="">Company Login</a>
      </p>
    </div>
  </form>
</body>

</html>
