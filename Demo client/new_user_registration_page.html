<!DOCTYPE html>
<html lang="en">

<head>
<link rel="stylesheet" href="../assets/css/common.css">
<link rel="stylesheet" href="../assets/css/company_registration.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New User registration </title>
</head>
<body>
  <header class="landing-nav">
    <div class="brand">
      <div class="brand_logo">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
          <rect x="9" y="11" width="6" height="5" rx="1"></rect>
          <path d="M10 11V9a2 2 0 1 1 4 0v2"></path>
        </svg>
      </div>
      <span class="brand-logo-text">SecureAuth</span>
    </div>
  </header>
  <form class="registration-page">
    <div class="form-data">
      <svg xmlns="http://w3.org" viewBox="0 0 24 24" width="48" height="48" fill="currentColor">
  <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/>
</svg>
      <h2>New User Register </h2>
      <input type="text" name="name" class="input-box" placeholder="Enter Name">
      <input type="email" name="email" class="input-box" placeholder=" Email">
      <input type="password" name="password" class="input-box" placeholder="password (Min 8 chars)">
      <input type="password" name="confirm_password" class="input-box" placeholder="Confirm password">
      <button type="submit" class="account-create">Create Account</button>
      <p class="login-link">
        Already have an account?
        <a href=""> Login</a>
      </p>
    </div>
  </form>
</body>

</html>
