<!DOCTYPE html>
<html lang="en">

<head>

  <link rel="stylesheet" href="../../assets/css/common.css">
  <link rel="stylesheet" href="../../assets/css/admin_login.css">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Super Admin Sign In</title>

</head>

<body>
  <header class="landing-nav">
    <div class="brand">
      <div class="brand_logo">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
          <rect x="9" y="11" width="6" height="5" rx="1"></rect>
          <path d="M10 11V9a2 2 0 1 1 4 0v2"></path>
        </svg>
      </div>
      <span class="brand-logo-text">
        SecureAuth
      </span>

    </div>

  </header>


  <main class="login-container">

    <form class="login-card">

      <div class="user-icon">

        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="45" height="45" fill="currentColor">

          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10
                    10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3
                    1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3
                    3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99
                    4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29
                    1.94-3.5 3.22-6 3.22z" />

        </svg>

      </div>


      <h2>Admin login</h2>
      <input type="email" name="email" class="input-box" placeholder="Email" required>
      <input type="password" name="password" class="input-box" placeholder="Password" required>
      <button type="submit" class="login-button">
        Continue to Login
      </button>

    </form>

  </main>

</body>

</html>
